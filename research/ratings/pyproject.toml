[project]
name = "valorant-ratings-research"
version = "0.1.0"
description = "Leakage-safe research for predictive and contextual Valorant ratings"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "arviz>=0.20,<0.23",
  "ipykernel>=6.29,<8",
  "joblib>=1.4,<2",
  "jupyterlab>=4.3,<5",
  "matplotlib>=3.9,<4",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "numpy>=2.0,<3",
  "optuna>=4.1,<5",
  "pandas>=2.2,<3",
  "polars>=1.17,<2",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=18,<24",
  "pymc>=5.18,<6",
  "pyyaml>=6.0,<7",
  "rich>=13.9,<15",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
ratings-research = "valorant_ratings.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires a local snapshot or database",
  "slow: model fit or notebook execution",
]

[tool.coverage.run]
source = ["valorant_ratings"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
